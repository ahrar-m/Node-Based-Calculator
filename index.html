<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CalcGraph — Node Based Calculator</title>
<style>
/* 01-base.css — design tokens, reset, typography, scrollbars */
:root {
  --bg-0: #06090f;
  --bg-1: #0a0e17;
  --bg-2: #0e1420;
  --bg-3: #141c2b;
  --glass: rgba(255,255,255,.032);
  --glass-2: rgba(255,255,255,.06);
  --glass-3: rgba(255,255,255,.1);
  --line: rgba(150,168,196,.13);
  --line-2: rgba(150,168,196,.26);
  --text: #e9eef8;
  --text-dim: #8fa0ba;
  --ink: #0b1020;
  --accent: #6e8bff;
  --accent-2: #38e1ff;
  --grad: linear-gradient(135deg, #7c8cff 0%, #22d3ee 60%, #3ddc97 120%);
  --grad-soft: linear-gradient(135deg, rgba(124,140,255,.22), rgba(56,225,255,.16));
  --ok: #3ddc97;
  --warn: #ffc857;
  --err: #ff6b81;
  --value: #3ddc97;
  --formula: #54c8ff;
  --group: #ffc857;
  --constant: #a78bfa;
  --num: #ffd166;
  --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, monospace;
  --radius: 10px;
  --radius-l: 16px;
  --radius-xl: 22px;
  --shadow-1: 0 2px 10px rgba(0,0,0,.28);
  --shadow-2: 0 14px 44px rgba(0,0,0,.55);
  --glow: 0 0 0 3px rgba(110,139,255,.16);
  --ease: cubic-bezier(.22,.8,.36,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background:
    radial-gradient(1100px 720px at 12% -8%, rgba(110,139,255,.15), transparent 60%),
    radial-gradient(900px 620px at 108% 4%, rgba(56,225,255,.11), transparent 55%),
    radial-gradient(1000px 900px at 50% 115%, rgba(61,220,151,.07), transparent 55%),
    var(--bg-1);
  color: var(--text);
  font: 14px/1.55 system-ui, "Segoe UI", Roboto, Inter, sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, select, textarea {
  font: inherit; color: var(--text);
  background: rgba(8,12,22,.55);
  border: 1px solid var(--line-2);
  border-radius: 9px;
  padding: 7px 10px;
  outline: none;
  transition: border-color .15s, box-shadow .15s, background .15s;
}
input:hover, select:hover, textarea:hover { border-color: rgba(150,168,196,.4); }
input:focus, select:focus, textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(110,139,255,.16);
  background: rgba(10,15,26,.8);
}
::placeholder { color: var(--text-dim); opacity: .6; }
select {
  appearance: none; -webkit-appearance: none;
  background-image:
    linear-gradient(45deg, transparent 50%, var(--text-dim) 50%),
    linear-gradient(135deg, var(--text-dim) 50%, transparent 50%);
  background-position: calc(100% - 16px) 55%, calc(100% - 11px) 55%;
  background-size: 5px 5px;
  background-repeat: no-repeat;
  padding-right: 30px;
  cursor: pointer;
}
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb {
  background: rgba(150,168,196,.16); border-radius: 6px;
  border: 2px solid transparent; background-clip: padding-box;
}
::-webkit-scrollbar-thumb:hover {
  background: rgba(150,168,196,.32);
  border: 2px solid transparent; background-clip: padding-box;
}
::-webkit-scrollbar-track { background: transparent; }
.scrollable { overflow: auto; }
.meta { color: var(--text-dim); font-size: 11px; font-weight: 400; opacity: .85; }
.kbd {
  font-family: var(--mono); font-size: 10.5px; padding: 1px 6px;
  border: 1px solid var(--line-2); border-radius: 5px;
  background: rgba(255,255,255,.05); color: var(--text-dim);
}


/* 02-layout.css — app shell grid, glass header, sidebars, footer */
#app { display: grid; grid-template-rows: 58px 1fr 42px; height: 100vh; }

/* ---------- Header (glass) ---------- */
.hdr {
  display: flex; align-items: center; gap: 12px;
  padding: 0 18px;
  background: rgba(9,13,22,.72);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
  z-index: 20;
  position: relative;
}
.hdr::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(110,139,255,.5), rgba(56,225,255,.4), transparent);
  opacity: .7; pointer-events: none;
}
.logo { display: flex; align-items: center; gap: 11px; white-space: nowrap; }
.logo-mark {
  width: 32px; height: 32px; border-radius: 10px;
  background: var(--grad);
  display: grid; place-items: center;
  color: #06121f; font-weight: 800; font-size: 18px;
  box-shadow: 0 4px 16px rgba(110,139,255,.45), inset 0 1px 0 rgba(255,255,255,.35);
}
.logo-name {
  font-weight: 800; font-size: 16px; letter-spacing: .4px;
  background: linear-gradient(120deg, #fff, #b9c7ff 55%, #7fe7ff);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.logo small {
  display: block; color: var(--text-dim); font-weight: 500;
  font-size: 10px; letter-spacing: .7px; text-transform: uppercase;
  margin-top: -3px;
}
.hdr .spacer { flex: 1; }
.hdr select {
  max-width: 280px; min-width: 170px;
  background-color: rgba(255,255,255,.04);
  border-color: var(--line-2);
  font-weight: 600; border-radius: 10px;
}
#saved-ind { margin-left: 6px; font-size: 12px; font-weight: 600; letter-spacing: .3px; }

/* ---------- Workspace ---------- */
.workspace { display: grid; grid-template-columns: 272px 1fr 336px; min-height: 0; }
aside {
  background: rgba(12,16,26,.5);
  border-right: 1px solid var(--line);
  min-height: 0; display: flex; flex-direction: column; overflow-y: auto;
}
#inspector { border-right: none; border-left: 1px solid var(--line); }

.side-section { padding: 13px 16px; border-bottom: 1px solid var(--line); }
.side-section h3 {
  font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px;
  color: var(--text-dim); margin-bottom: 9px;
  display: flex; align-items: center; gap: 7px; font-weight: 700;
}
.side-section h3::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%;
  background: var(--grad);
  box-shadow: 0 0 10px rgba(110,139,255,.8);
}
.side-section .flex-row { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- Main / view header ---------- */
#main { min-width: 0; min-height: 0; position: relative; display: flex; flex-direction: column; }
#main .view-header {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 16px;
  border-bottom: 1px solid var(--line);
  background: rgba(9,13,22,.55);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  z-index: 6;
}
#main .view-breadcrumbs {
  display: flex; align-items: center; gap: 3px;
  font-size: 13px; flex: 1; min-width: 0;
  overflow-x: auto; white-space: nowrap;
  color: var(--text-dim);
}
.crumb {
  color: var(--accent-2); cursor: pointer; padding: 3px 9px;
  border-radius: 8px; font-weight: 600;
  transition: background .15s, color .15s;
}
.crumb:hover { background: rgba(110,139,255,.14); color: #cfe0ff; }
.crumb.current { color: var(--text); cursor: default; background: rgba(255,255,255,.05); }
.crumb-sep { color: var(--text-dim); opacity: .55; }
#view-root { flex: 1; min-height: 0; position: relative; overflow: hidden; }

/* ---------- Footer (glass) ---------- */
.ftr {
  display: flex; align-items: center; gap: 14px;
  padding: 0 18px;
  background: rgba(9,13,22,.72);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  font-size: 12.5px; color: var(--text-dim);
}
.ftr .root-value {
  font-weight: 800; font-family: var(--mono); font-size: 13.5px;
  color: var(--ok);
  text-shadow: 0 0 16px rgba(61,220,151,.4);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ftr .spacer { flex: 1; }
.ftr .kbd { opacity: .85; }

/* ---------- Inspector additions ---------- */
.insp-head { padding: 14px 16px; border-bottom: 1px solid var(--line); }
.insp-name {
  flex: 1; min-width: 0;
  font-weight: 800; font-size: 16px;
  border-color: transparent; background: transparent;
  box-shadow: none;
}
.insp-name:hover { border-color: var(--line-2); background: rgba(255,255,255,.04); }
.insp-name:focus { border-color: var(--accent); background: rgba(8,12,22,.8); }
.value-pill { margin-top: 12px; }
.value-pill .big {
  font-size: 22px; font-weight: 800;
  font-family: var(--mono);
  background: linear-gradient(120deg, var(--ok), #9af7d0);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  word-break: break-word;
}
.value-pill dt { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1px; }
.field-label-row {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 10.5px; text-transform: uppercase; letter-spacing: .9px;
  color: var(--text-dim); font-weight: 700; margin: 12px 0 5px;
}


/* 03-components.css — buttons, chips, tabs, tree, modal, slider, fields, toasts, notices */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid var(--line-2);
  background: rgba(255,255,255,.045);
  color: var(--text);
  border-radius: 9px;
  padding: 6px 13px; font-size: 13px; font-weight: 600;
  transition: all .16s var(--ease);
  white-space: nowrap;
}
.btn:hover {
  border-color: rgba(110,139,255,.6);
  background: rgba(110,139,255,.12);
  transform: translateY(-1px);
  box-shadow: 0 6px 18px rgba(0,0,0,.28);
}
.btn:active { transform: translateY(0); }
.btn.primary {
  background: var(--grad);
  border-color: transparent;
  color: #08121f; font-weight: 800;
  box-shadow: 0 6px 22px rgba(80,120,255,.35);
}
.btn.primary:hover {
  filter: brightness(1.12);
  background: var(--grad); border-color: transparent;
  box-shadow: 0 8px 28px rgba(80,120,255,.5);
  transform: translateY(-1px);
}
.btn.danger { color: var(--err); }
.btn.danger:hover { border-color: rgba(255,107,129,.55); background: rgba(255,107,129,.1); }
.btn.small { padding: 4px 10px; font-size: 12px; border-radius: 8px; }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* Chips (machine-insertable tokens, snapshots, unit chips) */
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  border: 1px solid var(--line-2);
  background: rgba(255,255,255,.04);
  color: var(--text);
  border-radius: 999px;
  padding: 4px 12px; font-size: 12.5px; font-weight: 600;
  cursor: pointer; user-select: none;
  transition: all .15s var(--ease);
}
.chip:hover {
  border-color: var(--accent);
  background: rgba(110,139,255,.14);
  transform: translateY(-1px);
}
.chip .meta { color: var(--text-dim); font-size: 11px; font-family: var(--mono); font-weight: 500; }
.chip.constant { border-color: rgba(167,139,250,.55); color: #c4b5fd; background: rgba(167,139,250,.08); }
.chip.constant:hover { background: rgba(167,139,250,.18); }
.chip.term { border-color: rgba(84,200,255,.55); color: #aadcff; background: rgba(84,200,255,.07); }
.chip.term:hover { background: rgba(84,200,255,.16); }
.chip.op { border-color: rgba(110,139,255,.6); color: #c7d2ff; font-family: var(--mono); }
.chip.fn { border-color: rgba(255,200,87,.55); color: #ffe0a1; font-family: var(--mono); }
.chip.selected { outline: 2px solid var(--accent); outline-offset: 1px; }
.chip button.btn { padding: 0 4px; font-size: 11px; margin-left: 4px; border-radius: 6px; }

/* Tabs */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 10px; background: rgba(12,16,26,.45); }
.tab {
  padding: 9px 14px; color: var(--text-dim);
  border-bottom: 2px solid transparent;
  font-weight: 600; transition: color .15s;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--text); border-bottom-color: var(--accent); text-shadow: 0 0 14px rgba(110,139,255,.7); }

/* Badges */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px;
  color: var(--text-dim);
  border: 1px solid var(--line-2);
  border-radius: 6px; padding: 2px 8px;
  background: rgba(255,255,255,.03);
}
.badge.k-value { color: var(--value); border-color: rgba(61,220,151,.4); background: rgba(61,220,151,.08); }
.badge.k-formula { color: var(--formula); border-color: rgba(84,200,255,.4); background: rgba(84,200,255,.08); }
.badge.k-group { color: var(--group); border-color: rgba(255,200,87,.4); background: rgba(255,200,87,.08); }
.badge.k-constant { color: var(--constant); border-color: rgba(167,139,250,.4); background: rgba(167,139,250,.08); }

/* Tree / outline */
.tree { list-style: none; }
.tree li {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 9px; border-radius: 10px;
  cursor: pointer; font-size: 13.5px;
  border: 1px solid transparent;
  transition: background .14s, transform .14s, border-color .14s;
}
.tree li:hover { background: rgba(255,255,255,.05); transform: translateX(2px); }
.tree li.sel { background: rgba(110,139,255,.14); border-color: rgba(110,139,255,.35); }
.tree .caret { color: var(--text-dim); width: 16px; text-align: center; font-size: 11px; flex: none; }
.tree .val {
  margin-left: auto; font-family: var(--mono); color: var(--ok);
  font-size: 12px; font-weight: 700;
  background: rgba(61,220,151,.08);
  padding: 1px 9px; border-radius: 99px;
}
.kind-ic { width: 17px; text-align: center; font-size: 12px; flex: none; }
.kind-ic.value { color: var(--value); }
.kind-ic.formula { color: var(--formula); }
.kind-ic.group { color: var(--group); }
.kind-ic.constant { color: var(--constant); }

/* Modal */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(3,6,12,.6);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center;
  z-index: 60;
  animation: fadeIn .16s var(--ease);
}
.modal {
  background: linear-gradient(180deg, rgba(21,28,46,.96), rgba(11,16,28,.97));
  border: 1px solid var(--line-2);
  border-radius: 18px;
  box-shadow: var(--shadow-2);
  width: min(700px, 94vw); max-height: 90vh;
  display: flex; flex-direction: column;
  animation: pop .2s var(--ease);
  overflow: hidden;
}
.modal.wide { width: min(900px, 96vw); }
.modal h2 {
  font-size: 16px; font-weight: 800;
  padding: 16px 20px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.modal h2::before {
  content: "\2726";
  background: var(--grad);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.modal .m-body { padding: 16px 20px; overflow: auto; }
.modal .m-foot {
  padding: 14px 20px; border-top: 1px solid var(--line);
  display: flex; justify-content: flex-end; gap: 10px;
  background: rgba(255,255,255,.02);
}
.modal .close {
  width: 32px; height: 32px; border-radius: 9px;
  color: var(--text-dim); font-size: 15px;
  transition: all .15s;
}
.modal .close:hover { background: rgba(255,107,129,.14); color: var(--err); }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(16px) scale(.975); } }

/* Slider */
.slider-row {
  display: grid; grid-template-columns: 62px 1fr 66px; gap: 10px;
  align-items: center; margin: 8px 0;
}
.slider-row span { font-family: var(--mono); font-size: 11.5px; color: var(--text-dim); }
input[type=range] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 6px; border-radius: 999px;
  background: linear-gradient(90deg, rgba(110,139,255,.65), rgba(56,225,255,.7));
  outline: none; cursor: pointer; border: none; box-shadow: none; padding: 0; margin: 0;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 17px; height: 17px; border-radius: 50%;
  background: #fff; border: 3px solid var(--accent);
  box-shadow: 0 0 14px rgba(110,139,255,.85);
  transition: transform .12s var(--ease);
}
input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.18); }
input[type=range]::-moz-range-thumb {
  width: 15px; height: 15px; border-radius: 50%;
  background: #fff; border: 3px solid var(--accent);
  box-shadow: 0 0 14px rgba(110,139,255,.85);
}
.slider-row output { font-family: var(--mono); text-align: right; color: #cfe0ff; font-weight: 800; }

/* Form fields */
.field { margin: 10px 0; }
.field label {
  display: flex; align-items: center; gap: 5px;
  font-size: 10.5px; text-transform: uppercase; letter-spacing: .9px;
  color: var(--text-dim); margin-bottom: 5px; font-weight: 700;
}
.field input[type=text], .field input[type=number], .field select, .field textarea { width: 100%; }
.field textarea { resize: vertical; min-height: 70px; font-family: var(--mono); line-height: 1.55; }

/* Unit picker */
.unit-pick { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.unit-pick select { min-width: 118px; }
.unit-custom {
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  margin-top: 8px;
  padding: 8px 10px; border: 1px dashed var(--line-2);
  border-radius: 10px; background: rgba(255,255,255,.02);
  width: 100%;
}
.derived-unit {
  font-family: var(--mono); font-size: 12px;
  color: var(--constant);
  background: rgba(167,139,250,.08);
  border: 1px dashed rgba(167,139,250,.4);
  border-radius: 9px; padding: 6px 11px; margin-top: 8px;
}
.derived-unit.mismatch { color: var(--warn); background: rgba(255,200,87,.07); border-color: rgba(255,200,87,.4); }
.formula-view { font-family: var(--mono); font-size: 13.5px; word-break: break-word; }

/* Toast */
.toast-wrap {
  position: fixed; bottom: 54px; right: 16px;
  display: flex; flex-direction: column; gap: 8px;
  z-index: 120;
}
.toast {
  display: flex; align-items: center; gap: 10px;
  background: rgba(18,24,40,.96);
  border: 1px solid var(--line-2);
  border-radius: 12px;
  padding: 11px 16px;
  box-shadow: var(--shadow-2);
  max-width: 380px; font-size: 13px; font-weight: 600;
  animation: toastIn .25s var(--ease);
}
.toast::before {
  content: ""; width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 10px var(--accent); flex: none;
}
.toast.err::before { background: var(--err); box-shadow: 0 0 10px var(--err); }
.toast.ok::before { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
@keyframes toastIn { from { opacity: 0; transform: translateX(30px); } }

/* Notices */
.notice { font-size: 13px; padding: 9px 12px; border-radius: 9px; margin: 7px 0; line-height: 1.55; }
.notice.err { background: rgba(255,107,129,.09); border: 1px solid rgba(255,107,129,.3); color: #ffb3bf; }
.notice.ok { background: rgba(61,220,151,.08); border: 1px solid rgba(61,220,151,.28); color: var(--ok); }
.notice.dim { color: var(--text-dim); background: rgba(255,255,255,.03); border: 1px solid var(--line); }

/* Key-value rows */
.kv { display: grid; grid-template-columns: 118px 1fr; gap: 5px 12px; font-size: 13px; }
.kv dt { color: var(--text-dim); display: flex; align-items: center; gap: 6px; font-size: 11.5px; }
.kv dd { font-family: var(--mono); word-break: break-word; font-weight: 600; }

.empty-hint {
  color: var(--text-dim); font-size: 13px;
  padding: 28px 20px; text-align: center; line-height: 1.9;
}
.empty-hint::before {
  content: "\25cc"; display: block; font-size: 34px;
  color: rgba(110,139,255,.5); margin-bottom: 10px;
}


/* 04-graph.css — auto-layout node graph: glowing bezier edges, rich nodes, pan/zoom */
#view-root {
  background:
    radial-gradient(rgba(160,180,220,.055) 1px, transparent 1.5px),
    rgba(5,8,14,.42);
  background-size: 24px 24px, auto;
}
#view-root svg { display: block; width: 100%; height: 100%; cursor: grab; }
#view-root svg.panning { cursor: grabbing; }

/* ---------- Edges ---------- */
.edge {
  stroke: url(#cg-edgeGrad);
  stroke-width: 1.9;
  fill: none;
  opacity: .72;
  transition: opacity .15s, stroke-width .15s;
}
.edge:hover { opacity: 1; }
.edge-hl { opacity: 1; stroke-width: 2.8; filter: drop-shadow(0 0 5px rgba(110,139,255,.6)); }
.edge.group-edge {
  stroke: url(#cg-edgeGradG);
  stroke-dasharray: 7 5;
  stroke-width: 2.1;
  opacity: .8;
  animation: dashFlow 14s linear infinite;
}
@keyframes dashFlow { to { stroke-dashoffset: -240; } }
.edge-label {
  font-family: var(--mono);
  font-size: 10px; font-weight: 700;
  fill: var(--constant);
  background: transparent;
  filter: drop-shadow(0 1px 2px rgba(0,0,0,.7));
}

<body>
<div id="app"></div>
<script>
"use strict";
(() => {
  "use strict";
  const CG = (typeof window !== "undefined" ? window : globalThis).CalcGraph =
    (typeof window !== "undefined" ? window : globalThis).CalcGraph || {};

  const PERIODS = { once: 1, week: 52, month: 12, year: 1 };
  const PERIOD_ORDER = ["once", "week", "month", "year"];
  const KINDS = ["value", "formula", "group"];
  const IDENT = /^[A-Za-z_][A-Za-z0-9_]*$/;

  function yearlyFactor(p) { return PERIODS[p] !== undefined ? PERIODS[p] : 1; }
  function periodFactor(child, parent) { return yearlyFactor(child) / yearlyFactor(parent); }
  function fmt(n) {
    if (typeof n !== "number" || !Number.isFinite(n)) return "err";
    if (Number.isInteger(n) && Math.abs(n) < 1e15) return String(n);
    return String(Number(n.toFixed(6)));
  }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function uid() { return "id-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  CG.util = { PERIODS, PERIOD_ORDER, yearlyFactor, periodFactor, fmt, esc, uid, IDENT };

  class Model {
    constructor(data, globalConstants) {
      this.orig = data;
      this.formatVersion = data.formatVersion || "0.1";
      this.id = data.id || uid();
      this.name = data.name || "Untitled model";
      this.description = data.description || "";
      this.root = data.root || "";
      this.libraries = Array.isArray(data.libraries) ? data.libraries : [];
      this.globalLibraries = Array.isArray(data.globalLibraries) ? data.globalLibraries : [];
      this.terms = Array.isArray(data.terms) ? data.terms.map(t => ({ ...t, children: t.children ? [...t.children] : [] })) : [];
      this.projectConstants = this.libraries.flatMap(l => (Array.isArray(l.constants) ? l.constants : []));
      this.globalConstants = Array.isArray(globalConstants) ? globalConstants : [];
      this._index();
      this.errors = this.validate();
    }

    _index() {
      this.byId = new Map();
      this.byName = new Map();
      for (const t of this.terms) {
        if (t.id) this.byId.set(t.id, t);
        this.byName.set(t.name, t);
      }
      this.constantsByName = new Map();
      for (const c of this.projectConstants) if (!this.constantsByName.has(c.name)) this.constantsByName.set(c.name, c);
      for (const c of this.globalConstants) if (!this.constantsByName.has(c.name)) this.constantsByName.set(c.name, c);
    }

    termByName(n) { return this.byName.get(n); }
    constantByName(n) { return this.constantsByName.get(n); }

    depsOf(term) {
      if (term.kind === "group") return [...(term.children || [])];
      if (term.kind === "formula") {
        try { return CG.parser.identifiers(term.formula); } catch { return []; }
      }
      return [];
    }

    parentsOf(name) {
      const out = [];
      for (const t of this.terms) {
        if (t.name === name) continue;
        if (t.kind === "group" && (t.children || []).includes(name)) out.push(t.name);
        else if (t.kind === "formula") {
          try { if (CG.parser.identifiers(t.formula).includes(name)) out.push(t.name); } catch {}
        }
      }
      return out;
    }

    roots() {
      const withParent = new Set();
      for (const t of this.terms) for (const p of this.parentsOf(t.name)) withParent.add(p);
      return this.terms.filter(t => !withParent.has(t.name)).map(t => t.name);
    }

    validate() {
      const errs = [];
      if (!this.terms.length) errs.push("Model has no terms.");
      const seenNames = new Set(), seenIds = new Set();
      const deps = new Map();
      for (const t of this.terms) {
        if (!t.name) { errs.push("A term is missing its name."); continue; }
        if (seenNames.has(t.name)) errs.push("Term name '" + t.name + "' is used more than once.");
        seenNames.add(t.name);
        if (t.id && seenIds.has(t.id)) errs.push("Term id '" + t.id + "' is used more than once.");
        if (t.id) seenIds.add(t.id);
        if (!IDENT.test(t.name)) errs.push("Term name '" + t.name + "' is not a valid identifier (letters, digits, underscore).");
        if (!KINDS.includes(t.kind)) errs.push("Term '" + t.name + "': unknown kind '" + t.kind + "'.");
        if (t.period && !PERIODS.hasOwnProperty(t.period)) errs.push("Term '" + t.name + "': invalid period '" + t.period + "'.");
        if (t.kind === "formula" && !t.formula) errs.push("Term '" + t.name + "': kind formula needs a formula.");
        if (t.kind === "group") {
          if (t.formula) errs.push("Term '" + t.name + "': groups are sums of their children; remove the formula or change kind to 'formula'.");
          if (!t.children || !t.children.length) errs.push("Term '" + t.name + "': group needs at least one child.");
        }
        if (t.kind === "value" && !Number.isFinite(Number(t.value))) errs.push("Term '" + t.name + "': value is not a number.");
        if (t.slider) {
          const s = t.slider;
          if (!Number.isFinite(Number(s.min)) || !Number.isFinite(Number(s.max)) || !Number.isFinite(Number(s.step)) || Number(s.min) > Number(s.max))
            errs.push("Term '" + t.name + "': slider needs valid min/max/step.");
        }
        if (t.snapshots && !Array.isArray(t.snapshots)) errs.push("Term '" + t.name + "': snapshots must be an array.");
        deps.set(t.name, this.depsOf(t));
      }
      if (this.root && !this.byName.has(this.root)) errs.push("Root '" + this.root + "' is not a term.");
      if (!this.root && this.terms.length) errs.push("No root term set.");

      for (const t of this.terms) {
        if (t.kind !== "formula") continue;
        let names = [];
        try { names = CG.parser.identifiers(t.formula); }
        catch (e) { errs.push("Term '" + t.name + "': formula syntax error — " + e.message); continue; }
        for (const ref of names) {
          if (!this.byName.has(ref) && !this.constantsByName.has(ref))
            errs.push("Term '" + t.name + "': references unknown name '" + ref + "'.");
        }
      }
      for (const t of this.terms) {
        if (t.kind !== "group") continue;
        for (const c of t.children || []) {
          if (!this.byName.has(c)) errs.push("Group '" + t.name + "': child '" + c + "' is not a term.");
          else { const d = deps.get(t.name) || []; if (!d.includes(c)) d.push(c); deps.set(t.name, d); }
        }
      }

      const state = new Map();
      const stack = [];
      const inCycle = new Set();
      const visit = (name) => {
        if (state.get(name) === 2) return;
        if (state.get(name) === 1) {
          const i = stack.indexOf(name);
          if (i >= 0) stack.slice(i).forEach(n => inCycle.add(n));
          return;
        }
        state.set(name, 1);
        stack.push(name);
        for (const d of deps.get(name) || []) if (this.byName.has(d)) visit(d);
        stack.pop();
        state.set(name, 2);
      };
      for (const t of this.terms) visit(t.name);
      if (inCycle.size) errs.push("Circular dependency involving: " + [...inCycle].join(" -> ") + " -> " + [...inCycle][0]);
      return errs;
    }

    toJSON() {
      return {
        formatVersion: this.formatVersion,
        id: this.id,
        name: this.name,
        description: this.description,
        root: this.root,
        globalLibraries: [...this.globalLibraries],
        libraries: this.libraries,
        terms: this.terms.map(t => JSON.parse(JSON.stringify(t)))
      };
    }

    static fromJSON(text, globalConstants) {
      let data;
      try { data = typeof text === "string" ? JSON.parse(text) : text; }
      catch (e) { throw new Error("Not valid JSON: " + e.message); }
      if (!data || typeof data !== "object" || !Array.isArray(data.terms))
        throw new Error("Model JSON must be an object with a 'terms' array.");
      const m = new Model(data, globalConstants);
      if (m.errors.length) throw new Error("Model has " + m.errors.length + " problem(s):\n- " + m.errors.join("\n- "));
      return m;
    }
  }

  CG.model = { Model, PERIODS, PERIOD_ORDER, yearlyFactor, periodFactor };
})();

(() => {
  "use strict";
  const CG = (typeof window !== "undefined" ? window : globalThis).CalcGraph =
    (typeof window !== "undefined" ? window : globalThis).CalcGraph || {};

  const CMP = new Set([">", "<", ">=", "<=", "==", "!="]);

  function tokenize(src) {
    const toks = [];
    let i = 0;
    while (i < src.length) {
      const ch = src[i];
      if (ch === " " || ch === "\t" || ch === "\n" || ch === "\r") { i++; continue; }
      const start = i;
      if (/[0-9]/.test(ch) || (ch === "." && /[0-9]/.test(src[i + 1] || ""))) {
        let j = i;
        while (j < src.length && /[0-9.]/.test(src[j])) j++;
        const s = src.slice(i, j);
        if (/^(\d+\.?\d*|\.\d+)$/.test(s)) {
          const n = Number(s);
          if (Number.isFinite(n)) { toks.push({ t: "num", v: n, p: start }); i = j; continue; }
        }
        throw new Error("Bad number at position " + start);
      }
      if (/[A-Za-z_]/.test(ch)) {
        let j = i;
        while (j < src.length && /[A-Za-z0-9_]/.test(src[j])) j++;
        toks.push({ t: "ident", v: src.slice(i, j), p: start }); i = j; continue;
      }
      const two = src.slice(i, i + 2);
      if (["<=", ">=", "==", "!="].includes(two)) { toks.push({ t: "op", v: two, p: start }); i += 2; continue; }
      if ("+-*/^(),<>=:".includes(ch)) { toks.push({ t: "op", v: ch, p: start }); i++; continue; }
      throw new Error("Unexpected character '" + ch + "' at position " + start);
    }
    toks.push({ t: "eof", v: "", p: src.length });
    return toks;
  }

  const PREC = { "==": 1, "!=": 1, "<": 1, ">": 1, "<=": 1, ">=": 1, "+": 2, "-": 2, "*": 3, "/": 3, "^": 4 };

  class Parser {
    constructor(toks) { this.toks = toks; this.pos = 0; }
    peek() { return this.toks[this.pos]; }
    next() { return this.toks[this.pos++]; }
    expectOp(v) {
      const t = this.next();
      if (t.t !== "op" || t.v !== v) throw new Error("Expected '" + v + "'" + (t.t === "eof" ? " at end of formula" : ""));
      return t;
    }
    parseExpr(minP) {
      let left = this.parseUnary();
      for (;;) {
        const t = this.peek();
        if (t.t !== "op" || !(t.v in PREC)) break;
        const p = PREC[t.v];
        if (p < minP) break;
        this.next();
        const nextMin = (t.v === "^") ? p : p + 1;
        const right = this.parseExpr(nextMin);
        left = { t: "bin", op: t.v, l: left, r: right, p: t.p };
      }
      return left;
    }
    parseUnary() {
      const t = this.peek();
      if (t.t === "op" && (t.v === "-" || t.v === "+")) {
        this.next();
        return { t: "un", op: t.v, e: this.parseUnary(), p: t.p };
      }
      return this.parsePrimary();
    }
    parsePrimary() {
      const t = this.next();
      if (t.t === "num") return { t: "num", v: t.v, p: t.p };
      if (t.t === "ident") {
        const nxt = this.peek();
        if (nxt.t === "op" && nxt.v === "(") {
          this.next();
          const args = [];
          if (!(this.peek().t === "op" && this.peek().v === ")")) {
            for (;;) {
              args.push(this.parseExpr(0));
              const s = this.peek();
              if (s.t === "op" && s.v === ",") { this.next(); continue; }
              break;
            }
          }
          this.expectOp(")");
          return { t: "call", fn: t.v, args, p: t.p };
        }
        return { t: "name", n: t.v, p: t.p };
      }
      if (t.t === "op" && t.v === "(") {
        const e = this.parseExpr(0);
        this.expectOp(")");
        return e;
      }
      throw new Error("Unexpected token at position " + t.p);
    }
  }

  function parse(src) { return new Parser(tokenize(src)).parseExpr(0); }

  const FUNCS = {
    sum:     { min: 1, max: Infinity, eval: (a) => a.reduce((s, x) => s + x, 0) },
    min:     { min: 1, max: Infinity, eval: (a) => Math.min(...a) },
    max:     { min: 1, max: Infinity, eval: (a) => Math.max(...a) },
    avg:     { min: 1, max: Infinity, eval: (a) => a.reduce((s, x) => s + x, 0) / a.length },
    round:   { min: 1, max: 2, eval: (a) => a.length === 2 ? Number(a[0].toFixed(a[1])) : Math.round(a[0]) },
    abs:     { min: 1, max: 1, eval: (a) => Math.abs(a[0]) },
    if:      { min: 3, max: 3, eval: (a) => (a[0] ? a[1] : a[2]) },
    weekly:  { min: 1, max: 1, eval: (a) => a[0] },
    monthly: { min: 1, max: 1, eval: (a) => a[0] },
    yearly:  { min: 1, max: 1, eval: (a) => a[0] }
  };

  function evaluate(ast, env) {
    switch (ast.t) {
      case "num": return { ok: true, value: ast.v };
      case "name": {
        const v = env[ast.n];
        if (typeof v !== "number" || !Number.isFinite(v)) return { ok: false, error: "no value for '" + ast.n + "'" };
        return { ok: true, value: v };
      }
      case "un": {
        const r = evaluate(ast.e, env);
        if (!r.ok) return r;
        return { ok: true, value: ast.op === "-" ? -r.value : r.value };
      }
      case "bin": {
        const l = evaluate(ast.l, env), rr = evaluate(ast.r, env);
        if (!l.ok) return l; if (!rr.ok) return rr;
        if (CMP.has(ast.op)) {
          const a = l.value, b = rr.value;
          const res = ast.op === ">" ? a > b : ast.op === "<" ? a < b : ast.op === ">=" ? a >= b : ast.op === "<=" ? a <= b : ast.op === "==" ? a === b : a !== b;
          return { ok: true, value: res ? 1 : 0 };
        }
        const a = l.value, b = rr.value;
        let v;
        switch (ast.op) {
          case "+": v = a + b; break;
          case "-": v = a - b; break;
          case "*": v = a * b; break;
          case "/": if (b === 0) return { ok: false, error: "division by zero" }; v = a / b; break;
          case "^": v = Math.pow(a, b); break;
        }
        if (!Number.isFinite(v)) return { ok: false, error: "result is not a number" };
        return { ok: true, value: v };
      }
      case "call": {
        const fn = FUNCS[ast.fn];
        if (!fn) return { ok: false, error: "unknown function '" + ast.fn + "'" };
        if (ast.args.length < fn.min || ast.args.length > fn.max) return { ok: false, error: ast.fn + "() called with wrong number of arguments" };
        const vals = [];
        for (const a of ast.args) { const r = evaluate(a, env); if (!r.ok) return r; vals.push(r.value); }
        try { return { ok: true, value: fn.eval(vals) }; }
        catch { return { ok: false, error: "error in " + ast.fn + "()" }; }
      }
    }
    return { ok: false, error: "bad expression" };
  }

  function identifiers(src) {
    const ast = parse(src);
    const found = [];
    const seen = new Set();
    const walk = (n) => {
      if (!n) return;
      if (n.t === "name") { if (!seen.has(n.n)) { seen.add(n.n); found.push(n.n); } }
      else if (n.t === "bin") { walk(n.l); walk(n.r); }
      else if (n.t === "un") walk(n.e);
      else if (n.t === "call") n.args.forEach(walk);
    };
    walk(ast);
    return found;
  }

  function fmtNum(n) {
    if (!Number.isFinite(n)) return "err";
    if (Number.isInteger(n) && Math.abs(n) < 1e15) return String(n);
    return String(Number(n.toPrecision(8)));
  }

  function simplify(ast) {
    if (ast.t === "num" || ast.t === "name") return ast;
    if (ast.t === "un") {
      const e = simplify(ast.e);
      if (e.t === "num") return { t: "num", v: ast.op === "-" ? -e.v : e.v };
      return { t: "un", op: ast.op, e };

    if (ast.t === "bin") {
      const l = simplify(ast.l), r = simplify(ast.r);
      const bothNum = l.t === "num" && r.t === "num";
      if (bothNum && !CMP.has(ast.op)) {
        if (ast.op === "/" && r.v === 0) return { t: "bin", op: ast.op, l, r };

  // ------------------------------------------------------------------
  // Sidebar section — global units overview.
  // ------------------------------------------------------------------
  function renderSection(container, app) {
    const sec = el("div", "side-section");
    sec.appendChild(el("h3", "side-section-title", "UNIT LIBRARY (global)"));
    const lib = load();
    const customCount = lib.filter(u => !u.builtin).length;
    const chips = el("div", "flex-row");
    for (const q of quantities(lib).slice(0, 12)) {
      const c = el("span", "chip", q);
      c.title = symbolsFor(lib, q).join("  \u00b7  ");
      const cnt = el("span", "meta", " " + symbolsFor(lib, q).length);
      c.appendChild(cnt);

      chips.appendChild(c);
    }

    mgr.addEventListener("click", () => openManager(app));
    sec.appendChild(mgr);
    container.appendChild(sec);
  }

  // ------------------------------------------------------------------
  // Derived-unit analysis: walk the formula AST and combine the units of
  // referenced terms/constants so the suggested unit "matches the formula".
  // ------------------------------------------------------------------
  const SUP = { "0": "\u2070", "1": "\u00b9", "2": "\u00b2", "3": "\u00b3", "4": "\u2074", "5": "\u2075", "6": "\u2076", "7": "\u2077", "8": "\u2078", "9": "\u2079" };
  function needsParen(s) { return /[\u00b7/]/.test(s); }
  function mulU(a, b) {
    if (!a) return b; if (!b) return a;
    const pa = needsParen(a), pb = needsParen(b);
    return (pa ? "(" + a + ")" : a) + "\u00b7" + (pb ? "(" + b + ")" : b);
  }
  function divU(a, b) {
    if (!a && !b) return ""; if (!b) return a; if (!a) return "1/" + b;
    return (needsParen(a) ? "(" + a + ")" : a) + "/" + (needsParen(b) ? "(" + b + ")" : b);
  }
  function powU(a, n) {
    if (!a || n === 1) return a || "";
    const endsWithDigit = /[\u00b2\u00b3\u2070-\u2079\d]$/.test(a);
    const base = needsParen(a) || endsWithDigit ? "(" + a + ")" : a;
    if (n >= 0 && n <= 9) return base + SUP[String(n)];
    return base + "^" + n;
  }
  function unitOfAst(ast, getUnit) {
    switch (ast.t) {
      case "num": return "";
      case "name": return getUnit(ast.n) || "";
      case "un": return unitOfAst(ast.e, getUnit);
      case "bin": {
        const l = unitOfAst(ast.l, getUnit), r = unitOfAst(ast.r, getUnit);
        if (ast.op === "+" || ast.op === "-") {
          if (!l && !r) return "";
          if (!l) return r; if (!r) return l;
          return l === r ? l : "mixed (" + l + " vs " + r + ")";
        }
        if (ast.op === "*") return mulU(l, r);
        if (ast.op === "/") return divU(l, r);
        if (ast.op === "^") {
          if (ast.r.t === "num" && Number.isInteger(ast.r.v)) return powU(l, ast.r.v);
          return l;
        }
        return "";
      }
      case "call": {
        // careful: keep raw args so if(cond, a, b) still indexes correctly
        const raw = ast.args.map(a => unitOfAst(a, getUnit));
        if (ast.fn === "if") return raw[1] || raw[2] || "";
        const args = raw.filter(Boolean);
        if (ast.fn === "sum" || ast.fn === "avg" || ast.fn === "min" || ast.fn === "max") {
          return new Set(args).size <= 1 ? (args[0] || "") : "mixed";
        }
        return args[0] || "";
      }
    }
    return "";
  }
  function deriveUnit(formulaSrc, model) {
    if (!formulaSrc || !model) return "";
    let ast;
    try { ast = CG.parser.parse(formulaSrc); } catch { return ""; }
    const getUnit = (n) => {
      const t = model.termByName(n);
      if (t && t.unit) return t.unit;
      const c = model.constantByName(n);
      if (c && c.unit) return c.unit;
      return "";
    };
    try { return unitOfAst(CG.parser.simplify(ast), getUnit); } catch { return ""; }
  }

  CG.units = {
    load, save, builtins, quantities, symbolsFor, addCustom, removeUnit,
    periodSelect, renderUnitPicker, openManager, renderSection,
    deriveUnit, unitOfAst
  };
})();

(() => {
  "use strict";
  const CG = (typeof window !== "undefined" ? window : globalThis).CalcGraph =
    (typeof window !== "undefined" ? window : globalThis).CalcGraph || {};
  const U = CG.util;
  const el = CG.ui.el, clear = CG.ui.clear;

  const state = {
    model: null,
    results: null,
    selected: null,
    scopePath: [],
    view: "graph",
    eqTab: "combined",
    expanded: new Set(),
    numeric: false,
    treeCollapsed: new Set(),
    globalConstants: []
  };
  const dom = {};

  function stateView() {
    return {
      model: state.model,
      results: state.results,
      selected: state.selected,
      scopePath: state.scopePath,
      view: state.view,
      eqTab: state.eqTab,
      expanded: state.expanded,
      numeric: state.numeric,
      globalConstants: state.globalConstants
    };
  }
  function app() { return api; }
  function toast(msg, kind) {
    let wrap = document.querySelector(".toast-wrap");
    if (!wrap) { wrap = el("div", "toast-wrap"); document.body.appendChild(wrap); }
    const t = el("div", "toast" + (kind === "err" ? " err" : kind === "ok" ? " ok" : ""), msg);
    wrap.appendChild(t);
    setTimeout(() => t.remove(), 3800);
  }

  // ---------- skeleton ----------
  function buildSkeleton() {
    const root = document.getElementById("app");
    clear(root);

    // header
    const hdr = el("header", "hdr");
    const logo = el("div", "logo", "");
    logo.appendChild(el("span", "logo-mark", "ƒ"));
    const nameWrap = el("div", "", "");
    nameWrap.appendChild(el("span", "logo-name", "CalcGraph"));
    nameWrap.appendChild(el("small", "", "Node-Based Calculator"));
    logo.appendChild(nameWrap);
    hdr.appendChild(logo);
    const sel = el("select", "");
    sel.id = "model-select";
    hdr.appendChild(sel);
    const bNew = el("button", "btn", "New model");
    const bImport = el("button", "btn", "Import");
    const bExport = el("button", "btn", "Export JSON");
    hdr.appendChild(el("span", "spacer"));
    hdr.appendChild(bNew); hdr.appendChild(bImport); hdr.appendChild(bExport);
    const saved = el("span", "", "✓ saved");
    saved.id = "saved-ind"; saved.style.color = "var(--text-dim)"; saved.style.fontSize = "12px";
    hdr.appendChild(saved);
    root.appendChild(hdr);

    // workspace
    const ws = el("div", "workspace");
    const sidebar = el("aside", "", "");
    sidebar.id = "sidebar";
    const main = el("main", "", "");
    main.id = "main";
    const inspector = el("aside", "", "");
    inspector.id = "inspector";
    ws.appendChild(sidebar); ws.appendChild(main); ws.appendChild(inspector);
    root.appendChild(ws);

    // footer
    const ftr = el("footer", "ftr", "");
    const fv = el("span", "root-value", "");
    fv.id = "footer-value";
    const fh = el("span", "", "");
    fh.id = "footer-hint";
    fh.textContent = "right-drag to pan \u00b7 click any block to inspect \u00b7 double-click groups to dive in \u00b7 wheel to zoom";
    ftr.appendChild(fv); ftr.appendChild(el("span", "spacer")); ftr.appendChild(fh);
    root.appendChild(ftr);

    dom.header = hdr; dom.modelSelect = sel; dom.sidebar = sidebar; dom.main = main; dom.inspector = inspector; dom.footerValue = fv;

    bNew.addEventListener("click", newModel);
    bImport.addEventListener("click", () => CG.importer.openImportModal(app()));
    bExport.addEventListener("click", () => { if (state.model) { CG.storage.exportModel(state.model); toast("Exported JSON file."); } });
    sel.addEventListener("change", () => { if (sel.value) loadModel(sel.value); });
  }

  // ---------- actions ----------
  function commit() {
    const m = state.model;
    if (!m) return;
    m._index();
    const errs = m.validate();
    state.results = CG.evaluate.evaluateModel(m);
    if (errs.length) toast(errs[0], "err");
    setSavedFlag(false);
    CG.storage.autosave(app());
    render();
  }

  function select(name) { state.selected = name || null; render(); }
  function toggleExpand(name) { if (state.expanded.has(name)) state.expanded.delete(name); else state.expanded.add(name); render(); }
  function expandAll() { if (!state.model) return; state.expanded = new Set(state.model.terms.map(t => t.name)); render(); }
  function collapseAll() { state.expanded = new Set(); render(); }
  function enterGroup(name) { state.scopePath.push(name); state.selected = name; render(); }
  function toggleTree(name) { if (state.treeCollapsed.has(name)) state.treeCollapsed.delete(name); else state.treeCollapsed.add(name); render(); }
  function leaveGroup() { state.scopePath.pop(); render(); }
  function resetScope() { state.scopePath = []; render(); }

  function quickCommit() {
    const m = state.model;
    if (!m) return;
    m._index();
    state.results = CG.evaluate.evaluateModel(m);
    setSavedFlag(false);
    CG.storage.autosave(app());
    renderMain();
    renderFooter();
    renderHeaderSelect();
  }

  function updateTerm(name, patch, quiet) {
    const t = state.model.termByName(name);
    if (!t) return;
    Object.assign(t, patch);
    if (quiet) quickCommit(); else commit();
  }

  function addTerm(term) {
    state.model.terms.push(term);
    state.model._index();
    const errs = state.model.validate();
    if (errs.length) {
      state.model.terms.pop();
      state.model._index();
      throw new Error(errs[0]);
    }
    commit();
  }

  // Rename a term AND every reference to it (formulas, group children, root).
  // A dry-run clone is validated first so a broken rename never mutates the model.
  function renameTerm(oldName, newName) {
    const m = state.model;
    if (!m || !m.termByName(oldName)) return false;
    if (oldName === newName) return true;
    if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(newName)) {
      toast("Term names must be letters, digits or underscore — no spaces.", "err"); return false;
    }
    if (m.termByName(newName)) { toast("A term named '" + newName + "' already exists.", "err"); return false; }
    const applyRename = (data, o, n) => {
      const map = { [o]: n };
      for (const t of data.terms) {
        if (t.kind === "formula" && t.formula) t.formula = CG.parser.renameIdentifiers(t.formula, map);
        if (t.kind === "group" && Array.isArray(t.children)) t.children = t.children.map(c => c === o ? n : c);
        if (t.name === o) t.name = n;
      }
      if (data.root === o) data.root = n;
    };
    const clone = JSON.parse(JSON.stringify(m.toJSON()));
    applyRename(clone, oldName, newName);
    try {
      const test = new CG.model.Model(clone, state.globalConstants);
      if (test.errors.length) { toast("Can't rename: " + test.errors[0], "err"); return false; }
    } catch (e) { toast("Can't rename: " + e.message, "err"); return false; }
    applyRename(m, oldName, newName);
    m._index();
    if (state.selected === oldName) state.selected = newName;
    commit();
    toast("Renamed '" + oldName + "' \u2192 '" + newName + "'.", "ok");
    return true;
  }

  function deleteTerm(name) {
    const m = state.model;
    const idx = m.terms.findIndex(t => t.name === name);
    if (idx < 0) return;
    const [removed] = m.terms.splice(idx, 1);
    m._index();
    if (m.root === name) m.root = m.terms.length ? m.terms[0].name : "";
    const errs = m.validate();
    if (errs.length) { m.terms.splice(idx, 0, removed); m._index(); toast("Can't delete: " + errs[0], "err"); return; }
    if (state.selected === name) state.selected = null;
    commit();
  }

  function setSavedFlag(on) {
    const s = document.getElementById("saved-ind");
    if (!s) return;
    s.textContent = on ? "✓ saved" : "… saving";
    s.style.color = on ? "var(--ok)" : "var(--warn)";
  }

  // ---------- models ----------
  function newModel() {
    const name = prompt("Name for the new model?", "My model");
    if (!name) return;
    const rootName = (prompt("Root term name (the single final answer)?", "total") || "total").trim() || "total";
    const data = {
      formatVersion: "0.1",
      id: U.uid(),
      name,
      description: "",
      root: rootName,
      terms: [{ id: U.uid(), kind: "value", name: rootName, value: 0, period: "", unit: "", description: "Root term of this model." }]
    };
    try {
      const m = importModel(JSON.stringify(data));
      toast("New model '" + name + "' created.", "ok");
    } catch (e) { toast(e.message, "err"); }
  }

  function importModel(text) {
    const m = CG.model.Model.fromJSON(text, state.globalConstants);
    const list = CG.storage.loadModels();
    const entry = { id: m.id, name: m.name, updatedAt: Date.now(), model: m.toJSON() };
    const idx = list.findIndex(x => x.id === m.id);
    if (idx >= 0) list[idx] = entry; else list.push(entry);
    CG.storage.saveModels(list);
    loadModel(m.id);
    return m;
  }

  function loadModel(id) {
    const list = CG.storage.loadModels();
    const entry = list.find(x => x.id === id);
    if (!entry) { toast("Model not found.", "err"); return; }
    try {
      state.model = new CG.model.Model(entry.model, state.globalConstants);
    } catch (e) { toast("Model file is invalid: " + e.message, "err"); return; }
    state.selected = null;
    state.scopePath = [];
    state.expanded = new Set();
    state.treeCollapsed = new Set();
    state.results = CG.evaluate.evaluateModel(state.model);
    const errs = state.model.errors;
    if (errs.length) toast("Model has issues: " + errs[0], "err");
    render();
  }

  function loadDemo(key) {
    if (!CG.demos || !CG.demos[key]) { toast("Demo not found.", "err"); return; }
    try { importModel(JSON.stringify(CG.demos[key])); toast("Demo loaded.", "ok"); }
    catch (e) { toast("Demo failed: " + e.message, "err"); }
  }

  // ---------- constants ----------
  function addConstant(obj, scope) {
    if (scope === "global") {
      if (state.globalConstants.some(c => c.name === obj.name)) throw new Error("A global constant named '" + obj.name + "' already exists.");
      state.globalConstants.push(obj);
      CG.storage.saveGlobalConstants(state.globalConstants);
      if (state.model) { state.model.globalConstants = state.globalConstants; state.model._index(); commit(); }
      else render();
      toast("Global constant added.", "ok");
    } else {
      const m = state.model;
      let lib = m.libraries[0];
      if (!lib) { lib = { id: "lib-" + Math.random().toString(36).slice(2, 7), name: m.name + " constants", constants: [] }; m.libraries.push(lib); }
      if (lib.constants.some(c => c.name === obj.name)) throw new Error("A project constant named '" + obj.name + "' already exists.");
      lib.constants.push(obj);
      commit();
      toast("Project constant added.", "ok");
    }
  }

  function updateConstant(oldName, obj, scope) {
    if (scope === "global") {
      const i = state.globalConstants.findIndex(c => c.name === oldName);
      if (i >= 0) state.globalConstants[i] = obj;
      CG.storage.saveGlobalConstants(state.globalConstants);
      if (state.model) { state.model.globalConstants = state.globalConstants; state.model._index(); commit(); }
      else render();
    } else {
      const m = state.model;
      for (const lib of m.libraries) {
        const i = lib.constants.findIndex(c => c.name === oldName);
        if (i >= 0) { lib.constants[i] = obj; commit(); return; }
      }
      toast("Constant not found.", "err");
    }
  }

  function deleteConstant(name, scope) {
    if (scope === "global") {
      state.globalConstants = state.globalConstants.filter(c => c.name !== name);
      CG.storage.saveGlobalConstants(state.globalConstants);
      if (state.model) { state.model.globalConstants = state.globalConstants; state.model._index(); commit(); }
      else render();
      toast("Deleted global constant.", "ok");
    } else {
      const m = state.model;
      for (const lib of m.libraries) lib.constants = lib.constants.filter(c => c.name !== name);
      commit();
      toast("Deleted project constant.", "ok");
    }
  }

  // ---------- rendering ----------
  function render() {
    if (!state.model) return;
    renderHeaderSelect();
    renderSidebar();
    renderMain();
    renderInspector();
    renderFooter();
  }

  function renderHeaderSelect() {
    const sel = dom.modelSelect;
    clear(sel);
    const list = CG.storage.loadModels();
    const cur = state.model ? state.model.id : null;
    for (const m of list) {
      const o = el("option", "", m.name + (m.id === cur ? " ◉" : ""));
      o.value = m.id;
      if (m.id === cur) o.selected = true;
      sel.appendChild(o);
    }
  }

  function renderSidebar() {
    const sb = dom.sidebar;
    clear(sb);
    // models
    const secModels = el("div", "side-section");
    const msTitle = el("h3", "side-section-title", "MODELS");
    secModels.appendChild(msTitle);
    const savedList = el("div", "");
    secModels.appendChild(savedList);
    sb.appendChild(secModels);
    CG.storage.renderModelsList(savedList, app());

    // outline — hierarchical tree with collapsible groups
    const secTree = el("div", "side-section");
    const tTitle = el("h3", "side-section-title", "MODEL · " + state.model.name);
    secTree.appendChild(tTitle);
    const tree = el("ul", "tree");
    const childrenOf = new Map();
    const hasParent = new Set();
    for (const t of state.model.terms) {
      if (t.kind === "group" && Array.isArray(t.children)) for (const c of t.children) {
        if (!childrenOf.has(t.name)) childrenOf.set(t.name, []);
        childrenOf.get(t.name).push(c);
        hasParent.add(c);
      }
    }
    const order = (t) => t.name === state.model.root ? 0 : t.kind === "group" ? 1 : 2;
    const topLevel = state.model.terms.filter(t => !hasParent.has(t.name)).sort((a, b) => order(a) - order(b) || a.name.localeCompare(b.name));
    const walk = (name, depth) => {
      const t = state.model.termByName(name);
      if (!t) return;
      const isGroup = t.kind === "group";
      const kids = childrenOf.get(name) || [];
      const isCollapsed = state.treeCollapsed.has(name);
      const li = el("li", (isGroup ? "grp " : t.kind === "formula" ? "formula " : "value ") + (state.selected === name ? "sel" : ""));
      li.dataset.name = name;
      li.style.paddingLeft = (6 + depth * 16) + "px";
      const caret = el("span", "caret", isGroup && kids.length ? (isCollapsed ? "▸" : "▾") : "");
      if (isGroup && kids.length) caret.addEventListener("click", (ev) => { ev.stopPropagation(); toggleTree(name); });
      li.appendChild(caret);
      li.appendChild(el("span", "kind-ic " + t.kind, isGroup ? "▣" : t.kind === "formula" ? "ƒ" : "•"));
      li.appendChild(el("span", "li-name", t.name));
      const val = state.results && state.results.results[t.name];
      li.appendChild(el("span", "val", val ? (val.value !== undefined ? U.fmt(val.value) : "⚠") : ""));
      li.addEventListener("click", () => select(t.name));
      li.addEventListener("dblclick", () => { if (isGroup) enterGroup(t.name); });
      tree.appendChild(li);
      if (isGroup && kids.length && !isCollapsed) for (const k of kids) walk(k, depth + 1);
    };
    for (const t of topLevel) walk(t.name, 0);
    secTree.appendChild(tree);
    const btnRow = el("div", "flex-row");
    const bAddTerm = el("button", "btn small", "+ New term");
    bAddTerm.addEventListener("click", () => CG.builder.openNewTerm(app()));
    btnRow.appendChild(bAddTerm);
    if (CG.demos) {
      const bDemo1 = el("button", "btn small", "Demo: expenses");
      bDemo1.addEventListener("click", () => loadDemo("businessExpenses"));
      const bDemo2 = el("button", "btn small", "Demo: beam");
      bDemo2.addEventListener("click", () => loadDemo("beamDesign"));
      btnRow.appendChild(bDemo1); btnRow.appendChild(bDemo2);
    }
    secTree.appendChild(btnRow);
    sb.appendChild(secTree);

    // constants
    sb.appendChild(el("div", "", ""));
    const libBox = el("div", "");
    sb.appendChild(libBox);
    CG.libraries.renderLibraries(libBox, app());
    sb.appendChild(libBox);
  }

  function renderMain() {
    const main = dom.main;
    clear(main);
    const vh = el("div", "view-header");
    // breadcrumbs
    const crumbs = el("div", "view-breadcrumbs");
    const rootCrumb = el("span", "crumb" + (state.scopePath.length === 0 ? " current" : ""), state.model.name);
    rootCrumb.addEventListener("click", resetScope);
    crumbs.appendChild(rootCrumb);
    state.scopePath.forEach((g, i) => {
      const sep = el("span", "crumb-sep", "›");
      const c = el("span", "crumb" + (i === state.scopePath.length - 1 ? " current" : ""), g);
      c.addEventListener("click", () => { state.scopePath = state.scopePath.slice(0, i + 1); render(); });
      crumbs.appendChild(sep); crumbs.appendChild(c);
    });
    vh.appendChild(crumbs);
    if (state.scopePath.length) {
      const back = el("button", "btn small", "← out");
      back.addEventListener("click", leaveGroup);
      vh.appendChild(back);
    }
    // view toggle
    const tg = el("div", "flex-row");
    const bg = el("button", "btn small" + (state.view === "graph" ? " primary" : ""), "Graph");
    const be = el("button", "btn small" + (state.view === "equation" ? " primary" : ""), "Equation");
    bg.addEventListener("click", () => { state.view = "graph"; render(); });
    be.addEventListener("click", () => { state.view = "equation"; render(); });
    tg.appendChild(bg); tg.appendChild(be);
    if (state.view === "equation") {
      const bEx = el("button", "btn small", "Expand all"); bEx.addEventListener("click", expandAll);
      const bCol = el("button", "btn small", "Collapse all"); bCol.addEventListener("click", collapseAll);
      const bNum = el("button", "btn small" + (state.numeric ? " primary" : ""), "Numbers");
      bNum.addEventListener("click", () => { state.numeric = !state.numeric; render(); });
      const tabComb = el("button", "btn small" + (state.eqTab === "combined" ? " primary" : ""), "Combined");
      const tabAll = el("button", "btn small" + (state.eqTab === "all" ? " primary" : ""), "All terms");
      tabComb.addEventListener("click", () => { state.eqTab = "combined"; render(); });
      tabAll.addEventListener("click", () => { state.eqTab = "all"; render(); });
      tg.appendChild(tabComb); tg.appendChild(tabAll); tg.appendChild(bEx); tg.appendChild(bCol); tg.appendChild(bNum);
    }
    vh.appendChild(tg);
    main.appendChild(vh);

    const viewRoot = el("div", "");
    viewRoot.id = "view-root";
    viewRoot.style.cssText = "flex:1;min-height:0;position:relative;overflow:hidden;";
    main.appendChild(viewRoot);

    if (state.view === "graph") {
      const scope = state.scopePath.length ? state.scopePath[state.scopePath.length - 1] : null;
      // pass the RESULTS MAP (not the {results,root,contrib} wrapper) so node values render
      const layout = CG.layout.layoutGraph(state.model, state.results ? state.results.results : {}, scope);
      const handlers = {
        onSelect: (n) => select(n),
        onEnter: (n) => enterGroup(n),
        onBlank: () => select(null)
      };
      viewRoot.style.overflow = "hidden";
      CG.graph.renderGraph(viewRoot, layout, handlers);
      if (state.selected) CG.graph.highlightSelection(viewRoot, state.selected);
      // zoom controls
      const zc = el("div", "graph-zoom");
      const zi = el("button", "btn small", "+");     zi.title = "Zoom in";  zi.addEventListener("click", () => CG.graph.zoomBy(viewRoot, 0.85));
      const zo = el("button", "btn small", "\u2212"); zo.title = "Zoom out"; zo.addEventListener("click", () => CG.graph.zoomBy(viewRoot, 1.18));
      const zf = el("button", "btn small", "\u2922"); zf.title = "Fit (centre the graph)"; zf.addEventListener("click", () => viewRoot.__cgReset && viewRoot.__cgReset());
      zc.appendChild(zi); zc.appendChild(zo); zc.appendChild(zf);
      viewRoot.appendChild(zc);
      const hint = el("div", "graph-hint", "");
      hint.appendChild(el("span", "", "right-drag \u21c4 pan"));
      hint.appendChild(el("span", "", "wheel \u21bb zoom"));
      hint.appendChild(el("span", "", "double-click \u25b8 enter group"));
      viewRoot.appendChild(hint);
    } else {
      const body = el("div", "eq-scroll");
      body.style.cssText = "height:100%;overflow:auto;";
      const ctx = {
        model: state.model,
        results: state.results ? state.results.results : {},
        expanded: state.expanded,
        numeric: state.numeric,
        maxDepth: 12
      };
      if (state.eqTab === "combined") {
        const out = CG.equation.combinedEquationHtml(ctx);
        body.appendChild(el("div", "notice dim", "This is the complete equation of the whole model. Click a name to select it; double-click to expand/collapse that part."));
        const eq = el("div", "eq-root", "");
        eq.innerHTML = out.html;
        body.appendChild(eq);
      } else {
        const eq = el("div", "eq-root", "");
        eq.innerHTML = CG.equation.allTermsHtml(state.model, state.results.results);
        body.appendChild(eq);
      }
      viewRoot.appendChild(body);
      bindEquationClicks(viewRoot);
    }
  }

  function bindEquationClicks(root) {
    root.querySelectorAll(".eq-name[data-name]").forEach(el0 => {
      el0.addEventListener("click", (ev) => { ev.stopPropagation(); select(el0.dataset.name); });
      el0.addEventListener("dblclick", (ev) => { ev.stopPropagation(); toggleExpand(el0.dataset.name); });
    });
  }

  function renderInspector() {
    const ins = dom.inspector;
    CG.inspector.renderInspector(ins, app());
  }

  function renderFooter() {
    const fv = dom.footerValue;
    if (!state.model) { fv.textContent = ""; return; }
    const r = state.results && state.results.root;
    if (r && r.value !== undefined) {
      const t = state.model.termByName(state.model.root);
      let s = state.model.root + " = " + U.fmt(r.value);
      if (t && t.unit) s += " " + t.unit;
      if (t && t.period) s += " (" + t.period + ")";
      fv.textContent = s;
      fv.style.color = "var(--ok)";
    } else {
      fv.textContent = state.model.root + " = " + (r ? (r.error || "?") : "?");
      fv.style.color = "var(--err)";
    }
  }

  function bindGlobalEvents() {
    document.addEventListener("visibilitychange", () => { if (document.hidden) CG.storage.autosave(app()); });
    window.addEventListener("beforeunload", () => { if (state.model) { const list = CG.storage.loadModels(); const idx = list.findIndex(m => m.id === state.model.id); const entry = { id: state.model.id, name: state.model.name, updatedAt: Date.now(), model: state.model.toJSON() }; if (idx >= 0) list[idx] = entry; else list.push(entry); CG.storage.saveModels(list); } });
  }

  const api = {
    init,
    state: stateView,
    select, toggleExpand, expandAll, collapseAll, enterGroup, leaveGroup, resetScope, toggleTree,
    updateTerm, addTerm, deleteTerm, renameTerm,
    addConstant, updateConstant, deleteConstant,
    importModel, loadModel, loadDemo, newModel,
    openBuilder: (name) => CG.builder.openBuilder(app(), name),
    setView: (v) => { state.view = v; render(); },
    setEqTab: (v) => { state.eqTab = v; render(); },
    commit, toast, setSavedFlag
  };

  function init() {
    state.globalConstants = CG.storage.loadGlobalConstants();
    buildSkeleton();
    const saved = CG.storage.loadModels();
    if (saved.length) loadModel(saved[saved.length - 1].id);
    else if (CG.demos && CG.demos.businessExpenses) loadDemo("businessExpenses");
    else toast("No model yet — use Import or create terms in the sidebar.", "err");
  }

  CG.app = api;
  api.init();
})();
</script>
</body>
</html>
